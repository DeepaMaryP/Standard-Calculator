<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javacript Calculator</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="script.js"></script>
    <div class="container">
        <div class="row">
            <div class="col-6 border mx-auto m-5 rounded shadow">
                <div id="display" class="row w-100 mx-auto my-2">                 
                    <div id="dispayCalc" class="text-end text-muted pb-4" style="font-size: small; height: 20px;" ></div>
                    <div class="d-flex align-items-center digits rounded">
                        <p name="result" id="result" class=" text-end w-100 fs-4 " style="height: 25px;"> 0 </p>   
                    </div>                                  
                </div>
                <div class="row p-2  gap-2 ">
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="calculatePercentage()">%</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="calculateResult('∛x')">∛x</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded bg-danger">
                        <button class="btn" onclick="clearResult()">C</button>
                    </div>
                    <div class="col-md-2 col-sm-5 mx-md-auto border text-center rounded bg-danger">
                        <button class="btn" onclick="deleteLast()">⌫</button>
                    </div>
                </div>
                <div class="row p-2 gap-2 ">
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="calculateResult('1/x')" >1/x</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="calculateResult('x²')">x²</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="calculateResult('√x')">√x</button>
                    </div>
                    <div class="col-md-2 col-sm-5 mx-md-auto border text-center rounded  bg-warning">
                        <button class="btn" onclick="doOperations('÷')">÷</button>
                    </div>
                </div>
                <div class="row p-2 gap-2">
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick(7)">7</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick(8)">8</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick(9)">9</button>
                    </div>
                    <div class="col-md-2 col-sm-5 mx-md-auto border text-center rounded  bg-warning">
                        <button class="btn" onclick="doOperations('*')">*</button>
                    </div>
                </div>
                <div class="row p-2 gap-2">
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick(4)">4</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick(5)">5</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick(6)">6</button>
                    </div>
                    <div class="col-md-2 col-sm-5 mx-md-auto border text-center rounded  bg-warning">
                        <button class="btn" onclick="doOperations('-')">-</button>
                    </div>
                </div>

                <div class="row p-2 gap-2">
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick(1)">1</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick(2)">2</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick(3)">3</button>
                    </div>
                    <div class="col-md-2 col-sm-5 mx-md-auto border text-center rounded  bg-warning">
                        <button class="btn" onclick="doOperations('+')">+</button>
                    </div>
                </div>
                <div class="row p-2 gap-2">
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="negateValue()">+/-</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick(0)">0</button>
                    </div>
                    <div class="col-md-3 col-sm-5 border text-center rounded digits">
                        <button class="btn" onclick="handleClick('.')">.</button>
                    </div>
                    <div class="col-md-2 col-sm-5 mx-md-auto border text-center rounded bg-success">
                        <button class="btn" onclick="onEqual()">=</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
